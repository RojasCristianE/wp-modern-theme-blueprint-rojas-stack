# Espejo DDEV del bloque de variantes de imagen (infra/caddy/images.conf).
# Contrato idéntico: /cdn-cgi/image/w:{bucket}/{path-relativo-a-raíz-WP}
# → formato nativo de imgproxy. Diferencias del bloque prod:
#   - proxy_pass al servicio compose (DNS de la red Docker de DDEV),
#     no a 127.0.0.1.
#   - Sin header_down: nginx no reescribe cabeceras upstream igual que
#     Caddy; imgproxy ya sirve Cache-Control propio (USE_ETAGS activo).
location ^~ /cdn-cgi/image/ {
    # Solo buckets de la lista: nunca materializar anchos raros.
    if ($uri !~ "^/cdn-cgi/image/w:(320|480|640|800|1024|1280|1600|1920)/") {
        return 404;
    }

    # Sin traversal (la uri ya está normalizada por nginx; el chequeo
    # de ".." protege la reescritura).
    if ($uri ~ "\\.\\.|\\\\") {
        return 404;
    }

    # /cdn-cgi/image/w:800/wp-content/uploads/2026/09/f.jpg
    #   → /unsafe/rs:fit:800/plain/local:///wp-content/uploads/2026/09/f.jpg
    rewrite ^/cdn-cgi/image/w:([0-9]+)/(.*)$ /unsafe/rs:fit:$1/plain/local:///$2 break;

    proxy_pass http://imgproxy:8080;
    proxy_set_header Host imgproxy;
}
