# Variantes de imagen on-demand para el Rojas Stack (spec §12.1).
#
# Incluir desde el Caddyfile del sitio:
#   import /path/to/infra/caddy/images.conf
#
# Contrato: WP construye URLs /cdn-cgi/image/w:{bucket}/{path-relativo-a-uploads}
# (MediaServiceProvider::proxy_url). Caddy traduce al formato nativo de
# imgproxy y sirve con caché inmutable — las variantes quedan materializadas
# en el disco de imgproxy (caché efímera con eviction propio) y en la CDN
# que esté delante. Buckets: 320/480/640/800/1024/1280/1600/1920.
#
# Requisitos:
#   - imgproxy corriendo con LOCAL_FILESYSTEM_ROOT apuntando a la raíz
#     de WP (el Core Fantasma, con wp-content/ dentro — read-only):
#       volumes: ["/var/www/wp-core:/images:ro"]
#     y en su config: IMGPROXY_LOCAL_FILESYSTEM_ROOT=/images
#   - La caché de variantes es efímera (disco imgproxy + eviction): los
#     originales en uploads/ son la única copia permanente.
#   - En DDEV existe el espejo de este bloque en .ddev/nginx/site.conf
#     (mismo contrato, hostname del servicio en vez de 127.0.0.1).

@image-route path /cdn-cgi/image/*

handle @image-route {
	# /cdn-cgi/image/w:800/2026/09/foto.jpg → path del bucket + relativo
	@valid path_regexp variant ^/cdn-cgi/image/w:(320|480|640|800|1024|1280|1600|1920)/(?P<rel>.+)$

	handle @valid {
		# Solo originales bajo uploads/, sin traversal (el regexp ancla
		# el path relativo y prohíbe segmentos "..").
		@traversal path_regexp danger ^/cdn-cgi/image/w:[0-9]+/.*(\.\.|\\).*$

		abort @traversal

		reverse_proxy 127.0.0.1:8085 {
			# Formato nativo de imgproxy (signed en prod — ver abajo):
			# rs:fit:W con fuente del filesystem local.
			rewrite * /unsafe/rs:fit:{re.variant.1}/plain/local:///{re.rel.1}

			header_up Host imgproxy
			header_down Cache-Control "public, max-age=31536000, immutable"
			header_down X-Rojas-Image-Bucket "{re.variant.1}"
		}
	}

	# Buckets fuera de la lista: 404 (nunca materializar anchos raros).
	respond 404
}
